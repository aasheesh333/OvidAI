name: Ovid Device Test (Free Emulator)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to run the app (minutes)'
        default: '6'
        required: false
  push:
    branches: [ci/verified-android-build-20260827]

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # KVM works on GitHub's free ubuntu runners — boot takes ~2 min
      # unlike the 50-min TCG slog on the local box.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build debug APK (with x86_64 so the emulator can run it)
        run: flutter build apk --debug --target-platform android-x64

      # Reactivecircus runner handles SDK install, AVD creation, boot,
      # and gives us `adb` ready to go in later steps.
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: |
            set -e
            adb install build/app/outputs/flutter-apk/app-debug.apk
            echo "[TEST] APK installed, launching…"
            adb shell monkey -p com.dhanuk.ovidai -c android.intent.category.LAUNCHER 1
            sleep 45
            # Let the app's background sandbox provisioning run.
            for i in $(seq 1 6); do
              sleep 30
              done_marker=$(adb shell 'run-as com.dhanuk.ovidai ls files/sandbox/bin/node 2>/dev/null' || true)
              if [ -n "$done_marker" ]; then echo "[TEST] sandbox node present"; break; fi
            done
            echo "[TEST] --- device log tail (sandbox install) ---"
            adb logcat -d | grep -Ei 'ovid|sandbox|\[deb\]|\[apt\]|flutter' | tail -120 || true
            echo "[TEST] --- internal probe ---"
            adb shell 'run-as com.dhanuk.ovidai sh -c "ls files/sandbox/bin | head -30; files/sandbox/bin/bash -lc \"command -v node npm python git curl\" 2>&1"' || true
            mkdir -p test-output
            adb exec-out screencap -p > test-output/screen.png || true

      - name: Upload test artifacts (screenshot + log)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ovid-device-test
          path: test-output/
          if-no-files-found: ignore
