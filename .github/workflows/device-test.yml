name: Ovid Device Test (Free Emulator)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to run the app (minutes)'
        default: '6'
        required: false
  push:
    branches: [ci/verified-android-build-20260827]

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Detect optional secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then echo "firebase=true" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # KVM works on GitHub's free ubuntu runners — boot takes ~2 min
      # unlike the 50-min TCG slog on the local box.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - name: Write google-services.json
        if: env.firebase == 'true'
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Lower targetSdk for the test build (exec data-dir workaround)
        # Android 10+ with targetSdk >= 29 blocks exec() of files in the
        # app's private dir (avc: denied {execute_no_trans}), so the
        # sandbox bash can't start on an AOSP emulator. Real OEM devices
        # (ColorOS et al.) allow it, so only the TEST build uses 28.
        run: |
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 28/' \
            android/app/build.gradle.kts

      - name: Build debug APK (with x86_64 so the emulator can run it)
        run: flutter build apk --debug --target-platform android-x64

      # Reactivecircus runner handles SDK install, AVD creation, boot,
      # and gives us `adb` ready to go in later steps.
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: |
            set -x
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb shell monkey -p com.dhanuk.ovidai -c android.intent.category.LAUNCHER 1
            sleep 150
            mkdir -p test-output
            adb logcat -d > test-output/full.logcat.txt 2>&1 || true
            adb shell run-as com.dhanuk.ovidai ls files/sandbox/bin > test-output/sandbox-bin.txt 2>&1 || true
            adb exec-out screencap -p > test-output/screen.png 2>/dev/null || true
            echo TEST_COMPLETE_MARKER

      - name: Upload test artifacts (screenshot + log)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ovid-device-test
          path: test-output/
          if-no-files-found: ignore
