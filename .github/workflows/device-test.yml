name: Ovid Legacy Debug Emulator Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [ci/verified-android-build-20260827]

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect optional secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then echo "firebase=true" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # KVM works on GitHub's free ubuntu runners — boot takes ~2 min
      # unlike the 50-min TCG slog on the local box.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - name: Write google-services.json
        if: env.firebase == 'true'
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test release inventory gates
        run: python3 -m unittest discover -s tool -p 'release_*test.py'

      - name: Package native sandbox bootstrap (per-ABI jniLibs payload)
        run: bash tool/prepare_bootstrap.sh

      # Flutter's default ABI filters include all three ABIs even when only
      # android-x64 is requested. Build all three to avoid partial ABI contents.
      - name: Build universal debug APK (includes x86_64)
        run: flutter build apk --debug

      - name: Gate actual emulator artifact inventory
        run: >-
          python3 tool/release_inventory.py build/app/outputs/flutter-apk/app-debug.apk
          --mode debug --expected-target 28
          --output test-output/debug-inventory.json

      - name: Native host tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Reactivecircus runner handles SDK install, AVD creation, boot,
      # and gives us `adb` ready to go in later steps.
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: |
            set -eu
            mkdir -p test-output
            adb shell getconf PAGE_SIZE > test-output/page-size.txt
            adb shell getprop ro.product.cpu.abilist > test-output/device-abis.txt
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb shell monkey -p com.dhanuk.ovidai -c android.intent.category.LAUNCHER 1
            sleep 150
            # B. Vibe-coder simulation inside the sandbox: exercise every
            # core tool the agent uses (node, npm, python, git, curl).
            # base64-encoded to keep YAML/shell quoting sane.
            VIBE_B64=""
            # run-as is a diagnostic domain, not production app-process evidence.
            status=0
            adb shell "run-as com.dhanuk.ovidai sh -c 'echo $VIBE_B64 > files/vibe.b64; cd files; export LD_LIBRARY_PATH=/data/data/com.dhanuk.ovidai/files/sandbox/lib; export PATH=/data/data/com.dhanuk.ovidai/files/sandbox/bin; export HOME=/data/data/com.dhanuk.ovidai/files/sandbox/home; export TMPDIR=/data/data/com.dhanuk.ovidai/files/sandbox/tmp; mkdir -p \$HOME \$TMPDIR; /data/data/com.dhanuk.ovidai/files/sandbox/bin/base64 -d vibe.b64 > vibe.sh && /data/data/com.dhanuk.ovidai/files/sandbox/bin/bash -e -o pipefail vibe.sh'" > test-output/vibe-out.txt 2>&1 || status=$?
            cat test-output/vibe-out.txt
            adb logcat -d > test-output/full.logcat.txt 2>&1 || true
            adb shell run-as com.dhanuk.ovidai ls files/sandbox/bin > test-output/sandbox-bin.txt 2>&1 || true
            adb exec-out screencap -p > test-output/screen.png 2>/dev/null || true
            exit "$status"

      - name: Upload test artifacts (screenshot + log)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ovid-device-test
          path: |
            test-output/
            build/app/test-results/testDebugUnitTest/
          if-no-files-found: ignore
