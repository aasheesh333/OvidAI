name: Validate and Build Android

on:
  push:
    # hoplite/** — agent thread branches: push builds a device-testable
    # debug APK before review, so fixes can be tested without merging.
    branches: [main, ci/verified-android-build-20260827, 'hoplite/**']
  pull_request:
    branches: [main, ci/verified-android-build-20260827]
  workflow_dispatch:
    inputs:
      production_release:
        description: 'Build production-signed artifacts (all release gates required)'
        type: boolean
        default: false
      release_candidate:
        description: 'Build signed release-candidate APK + AAB (target 28 sideload)'
        type: boolean
        default: false
      bounded_flutter_suite:
        description: 'Use bounded Flutter batches with retained per-file machine evidence'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The complete Flutter suite is intentionally serialized to keep runner
    # memory stable; allow enough time for the suite plus Android compilation.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect development Firebase configuration
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "firebase=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Must match the SDK that generated the committed pubspec.lock:
          # `flutter pub get --enforce-lockfile` fails on an SDK mismatch
          # because test_api/vector_math are SDK-pinned.
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # Inject Firebase config from secret — never committed to the repo.
      - name: Write google-services.json
        if: env.firebase == 'true' && inputs.production_release != true
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json

      # Decode release keystore + write signing properties from secrets.
      - name: Prepare release signing
        if: inputs.production_release == true
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PINNED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          # Derive the certificate fingerprint from the keystore (the source of
          # truth) unless an operator pinned one via the repo variable.
          ANDROID_SIGNING_CERT_SHA256="$PINNED_CERT_SHA256"
          if [ -z "$ANDROID_SIGNING_CERT_SHA256" ]; then
            keystore="$(mktemp)"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
            ANDROID_SIGNING_CERT_SHA256="$(keytool -list -v -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              | sed -n 's/.*SHA256: *//p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$ANDROID_SIGNING_CERT_SHA256" ]; then
              echo "Unable to compute keystore certificate SHA-256" >&2
              exit 1
            fi
          fi
          export ANDROID_SIGNING_CERT_SHA256
          echo "ANDROID_SIGNING_CERT_SHA256=$ANDROID_SIGNING_CERT_SHA256" >> "$GITHUB_ENV"
          python3 tool/release_prepare.py

      - name: Test release inventory gates
        run: python3 -m unittest discover -s tool -p '*_test.py'

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Package native sandbox bootstrap (per-ABI jniLibs payload)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip >/dev/null
          bash tool/prepare_bootstrap.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        if: inputs.bounded_flutter_suite != true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(git ls-files 'test/**_test.dart')
          if (( ${#test_files[@]} == 0 )); then
            echo "No Flutter tests found." >&2
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "Running Flutter shard: $test_file"
            flutter test "$test_file"
          done

      - name: Test with bounded Flutter suite runner
        if: inputs.bounded_flutter_suite == true
        shell: bash
        run: |
          python3 tool/run_flutter_suite.py \
            --flutter "$(command -v flutter)" \
            --output "$RUNNER_TEMP/flutter-suite-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --lock "$RUNNER_TEMP/flutter-suite.lock" \
            --batch-size 20 --batch-timeout 300 --lock-timeout 900

      - name: Upload bounded Flutter suite evidence
        if: always() && inputs.bounded_flutter_suite == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Flutter-suite-evidence
          path: ${{ runner.temp }}/flutter-suite-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=OVID_BUILD=${{ github.sha }}

      - name: Native host tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Gate debug APK inventory
        run: >-
          python3 tool/release_inventory.py build/app/outputs/flutter-apk/app-debug.apk
          --mode debug --expected-target 28 --output build/release-inventory/debug.json

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-APK-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Release artifacts are intentionally manual. Building the signed APK and
      # AAB on every branch push duplicates the full Android compilation and
      # made ordinary validation take roughly 20 minutes instead of 10.
      - name: Detect release signing availability
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && { [ "${{ inputs.production_release }}" = "true" ] || [ "${{ inputs.release_candidate }}" = "true" ]; }; then
            echo "release_signing=true" >> "$GITHUB_ENV"
          fi

      - name: Prepare release signing
        if: env.release_signing == 'true' && inputs.production_release != true
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          # release_prepare.py refuses to overwrite; drop the push-time
          # google-services.json plus any stale signing inputs first.
          rm -f android/release-keystore.jks android/keystore.properties android/app/google-services.json
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          fingerprint="$(keytool -list -v -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sed -n 's/.*SHA256: *//p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$fingerprint" ]; then
            echo "Unable to compute keystore certificate SHA-256" >&2
            exit 1
          fi
          export ANDROID_SIGNING_CERT_SHA256="$fingerprint"
          echo "ANDROID_SIGNING_CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"
          python3 tool/release_prepare.py

      - name: Free disk before release build
        if: env.release_signing == 'true'
        run: |
          # The release build recompiles everything; the debug build's
          # intermediates plus the NDK toolchain leave the runner tight on
          # space (llvm-strip once died with "No space left on device").
          rm -rf build/app/intermediates build/app/tmp build/app/kotlin
          df -h /

      - name: Validate production key before release compilation
        if: inputs.production_release == true
        working-directory: android
        run: ./gradlew :app:validateProductionReleaseSigning --no-daemon

      - name: Build signed release APK + AAB
        if: env.release_signing == 'true'
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=OVID_BUILD=${{ github.sha }}
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --dart-define=OVID_BUILD=${{ github.sha }}

      # Manual production_release enforces the API 36 Play floor.
      - name: Gate release artifacts
        if: env.release_signing == 'true'
        run: |
          if [ "${{ inputs.production_release }}" = "true" ]; then mode=production; target=36; else mode=release; target=28; fi
          status=0
          python3 tool/release_inventory.py build/app/outputs/flutter-apk/app-release.apk --mode "$mode" --expected-target "$target" --output build/release-inventory/release-apk.json || status=1
          python3 tool/release_inventory.py build/app/outputs/bundle/release/app-release.aab --mode "$mode" --expected-target "$target" --output build/release-inventory/release-aab.json || status=1
          exit "$status"

      - name: Upload release APK
        if: env.release_signing == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-APK-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB (static gates only; not Play qualified on push)
        if: env.release_signing == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-AAB-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release inventory and native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-release-evidence
          path: |
            build/release-inventory/
            build/app/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove injected release credentials
        if: always() && (inputs.production_release == true || env.release_signing == 'true')
        run: rm -f android/keystore.properties android/release-keystore.jks android/app/google-services.json

      # NOTE: `--split-debug-info=build/symbols` produces Dart deobfuscation
      # symbols. These are intentionally NOT uploaded as a workflow artifact:
      # publishing them would defeat the `--obfuscate` build. They exist only
      # as ephemeral files on the runner and must be archived privately (or
      # uploaded to Crashlytics) if symbolication is ever needed.

  server-tests:
    name: Validate server account, sync, and collaboration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-test
          POSTGRES_DB: ovid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ovid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Job-local disposable database, never deployment credentials.
      SYNC_TEST_DATABASE_URL: postgresql://postgres:ci-disposable-test@127.0.0.1:5432/ovid_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install server requirements
        run: python -m pip install -r server/account/requirements.txt pytest

      - name: Test deployment runtime CLI integration
        run: python -m unittest -v tool.deployment_config_test

      - name: Test server account, sync, and collaboration
        run: pytest server/account/tests server/sync server/collaboration server/images server/shares
