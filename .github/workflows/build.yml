name: Validate and Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        shell: bash
        run: |
          shopt -s globstar nullglob
          tests=(test/**/*_test.dart)
          if (( ${#tests[@]} )); then
            flutter test
          else
            echo "No Flutter tests found; skipping."
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/Ovid-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ovid-APK-debug
          path: build/app/outputs/flutter-apk/Ovid-debug.apk
          if-no-files-found: error
          retention-days: 30
