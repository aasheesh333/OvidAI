name: Validate and Build Android

on:
  push:
    branches: [main, ci/verified-android-build-20260827]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Detect presence of signing secrets without using the `secrets` context
      # in `if:` conditions (not allowed by GitHub Actions). A flag file is
      # written and later steps check for its existence.
      - name: Detect signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "signing=true" >> "$GITHUB_ENV"
          fi
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "firebase=true" >> "$GITHUB_ENV"
          fi
          echo "signing_enabled=$( [ -n "$KEYSTORE_B64" ] && echo yes || echo no )"
          echo "firebase_enabled=$( [ -n "$GOOGLE_SERVICES" ] && echo yes || echo no )"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # Inject Firebase config from secret — never committed to the repo.
      - name: Write google-services.json
        if: env.firebase == 'true'
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json

      # Decode release keystore + write signing properties from secrets.
      - name: Prepare release signing
        if: env.signing == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release-keystore.jks
          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        shell: bash
        run: |
          shopt -s globstar nullglob
          tests=(test/**/*_test.dart)
          if (( ${#tests[@]} )); then
            flutter test
          else
            echo "No Flutter tests found; skipping."
          fi

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=OVID_BUILD=${{ github.sha }}

      - name: Build signed release APK + AAB
        if: env.signing == 'true'
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=OVID_BUILD=${{ github.sha }}
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --dart-define=OVID_BUILD=${{ github.sha }}

      - name: Rename artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/Ovid-debug.apk
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk \
               build/app/outputs/flutter-apk/Ovid-release.apk
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Ovid-APK-debug
          path: build/app/outputs/flutter-apk/Ovid-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: env.signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Ovid-APK-release
          path: build/app/outputs/flutter-apk/Ovid-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB (Play)
        if: env.signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Ovid-AAB-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload obfuscation symbols
        if: env.signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Ovid-symbols
          path: build/symbols
          if-no-files-found: ignore
          retention-days: 30
