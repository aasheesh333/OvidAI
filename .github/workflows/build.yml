name: Validate and Build Android

on:
  push:
    # hoplite/** — agent thread branches: push builds a device-testable APK
    # (signed release when the keystore secret exists, otherwise debug) before
    # review, so fixes can be tested without merging.
    branches:
      - main
      - ci/verified-android-build-20260827
      - 'hoplite/**'
      - 'harness/**'
      # The cloud-migration branch: every push builds a signed release APK +
      # AAB (the keystore secrets exist) so a device-testable artifact is
      # always available without merging to main.
      - 'feat/ovid-cloud'
      # The v2 UI rebuild branch: same guarantee. Without this entry a push
      # here only ran the `cloud` workflow, so the branch that ships the new
      # shell never produced an installable artifact.
      - 'feat/ovid-si-rebuild'
  pull_request:
    branches: [main, ci/verified-android-build-20260827]
  workflow_dispatch:
    inputs:
      production_release:
        description: 'Build production-signed artifacts (all release gates required)'
        type: boolean
        default: false
      release_candidate:
        description: 'Build signed release-candidate APK + AAB (target 28 sideload)'
        type: boolean
        default: false
      bounded_flutter_suite:
        description: 'Use bounded Flutter batches with retained per-file machine evidence'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job-level `if:` cannot read secrets or step env, so release-signing
  # availability is computed once here and consumed as a job output.
  detect:
    name: Detect release signing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_signing: ${{ steps.signing.outputs.release_signing }}
      production_profile: ${{ steps.signing.outputs.production_profile }}
    steps:
      - name: Detect release signing availability
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Signed APK + AAB on every push. The shipping branch uses the
          # production Play profile; other branches stay sideload candidates.
          production_profile=false
          if [ "${{ inputs.production_release }}" = "true" ]; then
            production_profile=true
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/feat/ovid-si-rebuild" ]; then
            production_profile=true
          fi
          release_signing=false
          if [ "$production_profile" = "true" ]; then
            release_signing=true
          elif [ -n "$KEYSTORE_B64" ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.release_candidate }}" = "true" ]; }; then
            release_signing=true
          fi
          echo "release_signing=$release_signing" >> "$GITHUB_OUTPUT"
          echo "production_profile=$production_profile" >> "$GITHUB_OUTPUT"

  # Signed release APK + AAB. Deliberately does NOT wait for the Flutter test
  # shards: artifacts are ready ~10 min after a push, while the run as a whole
  # stays red unless every test job passes too.
  release:
    name: Build signed release APK + AAB
    needs: detect
    # production_release also runs without the keystore secret so the
    # production signing preparation fails loudly instead of silently skipping.
    if: needs.detect.outputs.release_signing == 'true' || needs.detect.outputs.production_profile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      release_signing: ${{ needs.detect.outputs.release_signing }}
      production_profile: ${{ needs.detect.outputs.production_profile }}
      # In-app account deletion (server/account/README.md activation). Set the
      # repository variable OVID_ACCOUNT_ENABLED=true only after the account
      # service is live on the VPS; until then release builds ship the web /
      # email deletion request instead. Both release commands must pass it.
      OVID_ACCOUNT_ENABLED: ${{ vars.OVID_ACCOUNT_ENABLED || 'false' }}
      # Billing demo for an internal test build while Play monetization is not
      # approved. Leave the repository variable empty for any build that can
      # reach real users; the production guard refuses it outright.
      OVID_BILLING_DEMO: ${{ vars.OVID_BILLING_DEMO || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Must match the SDK that generated the committed pubspec.lock:
          # `flutter pub get --enforce-lockfile` fails on an SDK mismatch
          # because test_api/vector_math are SDK-pinned.
          flutter-version: '3.47.4'
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('pubspec.lock') }}"

      # Decode release keystore + write signing properties from secrets.
      - name: Prepare release signing
        if: env.production_profile == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PINNED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          # Derive the certificate fingerprint from the keystore (the source of
          # truth) unless an operator pinned one via the repo variable.
          ANDROID_SIGNING_CERT_SHA256="$PINNED_CERT_SHA256"
          if [ -z "$ANDROID_SIGNING_CERT_SHA256" ]; then
            keystore="$(mktemp)"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
            ANDROID_SIGNING_CERT_SHA256="$(keytool -list -v -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              | sed -n 's/.*SHA256: *//p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$ANDROID_SIGNING_CERT_SHA256" ]; then
              echo "Unable to compute keystore certificate SHA-256" >&2
              exit 1
            fi
          fi
          export ANDROID_SIGNING_CERT_SHA256
          echo "ANDROID_SIGNING_CERT_SHA256=$ANDROID_SIGNING_CERT_SHA256" >> "$GITHUB_ENV"
          python3 tool/release_prepare.py

      - name: Test release inventory gates
        run: python3 -m unittest discover -s tool -p '*_test.py'

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      # The on-device sandbox was removed with the cloud migration (P8 Task
      # 13), so no bootstrap payload is built or packaged here. The release
      # inventory gate REJECTS one if it ever reappears.

      - name: Prepare release signing
        if: env.release_signing == 'true' && env.production_profile != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          # release_prepare.py refuses to overwrite; drop any stale
          # google-services.json plus signing inputs first.
          rm -f android/release-keystore.jks android/keystore.properties android/app/google-services.json
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          fingerprint="$(keytool -list -v -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sed -n 's/.*SHA256: *//p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$fingerprint" ]; then
            echo "Unable to compute keystore certificate SHA-256" >&2
            exit 1
          fi
          export ANDROID_SIGNING_CERT_SHA256="$fingerprint"
          echo "ANDROID_SIGNING_CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"
          python3 tool/release_prepare.py

      - name: Free disk before release build
        if: env.release_signing == 'true'
        run: |
          # The release build compiles everything; the NDK toolchain leaves the
          # runner tight on space (llvm-strip once died with "No space left on
          # device").
          rm -rf build/app/intermediates build/app/tmp build/app/kotlin
          df -h /

      - name: Validate production key before release compilation
        if: env.production_profile == 'true'
        working-directory: android
        run: ./gradlew :app:validateProductionReleaseSigning --no-daemon

      - name: Guard release feature flags
        if: env.release_signing == 'true' || env.production_profile == 'true'
        run: |
          case "$OVID_ACCOUNT_ENABLED" in
            true) ;;
            false) echo "::warning::OVID_ACCOUNT_ENABLED=false: release ships the web/email account-deletion request, not in-app deletion." ;;
            *) echo "OVID_ACCOUNT_ENABLED must be true or false (got '$OVID_ACCOUNT_ENABLED')" >&2; exit 1 ;;
          esac
          # A production artifact must never grant a plan for free. The runtime
          # guard already refuses it, but a build that carries the define is a
          # mistake worth failing loudly rather than silently ignoring.
          if [ "$production_profile" = "true" ] && [ -n "$OVID_BILLING_DEMO" ]; then
            echo "OVID_BILLING_DEMO must be empty for a production release (got '$OVID_BILLING_DEMO')" >&2
            exit 1
          fi
          flutter test test/release_flags_test.dart \
            --dart-define=OVID_RELEASE_FLAGS_CHECK=true \
            --dart-define=OVID_ACCOUNT_ENABLED="$OVID_ACCOUNT_ENABLED"

      - name: Build signed release APK + AAB
        if: env.release_signing == 'true' || env.production_profile == 'true'
        run: |
          # Every build targets SDK 36. The Play profile (including its actual
          # manifest overlay) applies to the shipping branch push and manual
          # production dispatch; other branches remain sideload candidates.
          play_define=""
          if [ "$production_profile" = "true" ]; then play_define="--dart-define=OVID_PLAY_BUILD=true --dart-define=OVID_PRODUCTION=true --dart-define=OVID_APPCHECK=false"; fi
          # Billing demo: an internal test build has no approved store, so plan
          # selection runs locally. Refused for production by the guard above
          # and by the runtime check in Distribution.billingDemo.
          demo_define=""
          if [ -n "$OVID_BILLING_DEMO" ]; then demo_define="--dart-define=OVID_BILLING_DEMO=true"; fi
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=OVID_BUILD=${{ github.sha }} --dart-define=OVID_ACCOUNT_ENABLED="$OVID_ACCOUNT_ENABLED" $play_define $demo_define
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --dart-define=OVID_BUILD=${{ github.sha }} --dart-define=OVID_ACCOUNT_ENABLED="$OVID_ACCOUNT_ENABLED" $play_define $demo_define

      # Both profiles target API 36. The production profile requires the actual
      # Play manifest overlay, production signing, and the 16 KB gates. The
      # sideload profile rejects overlay leakage. Both forbid the removed
      # sandbox bootstrap payload.
      - name: Gate release artifacts
        if: env.release_signing == 'true' || env.production_profile == 'true'
        run: |
          if [ "$production_profile" = "true" ]; then mode=production; target=36; profile=play; else mode=release; target=36; profile=sideload; fi
          status=0
          python3 tool/release_inventory.py build/app/outputs/flutter-apk/app-release.apk --mode "$mode" --expected-target "$target" --profile "$profile" --output build/release-inventory/release-apk.json || status=1
          python3 tool/release_inventory.py build/app/outputs/bundle/release/app-release.aab --mode "$mode" --expected-target "$target" --profile "$profile" --output build/release-inventory/release-aab.json || status=1
          exit "$status"

      - name: Upload release APK
        if: env.release_signing == 'true' || env.production_profile == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-APK-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        if: env.release_signing == 'true' || env.production_profile == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-AAB-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release inventory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-release-evidence
          path: build/release-inventory/
          if-no-files-found: warn
          retention-days: 30

      # CT-021: keep release crashes symbolicatable. `--split-debug-info`
      # writes the Dart symbols to build/symbols; R8 writes the Java/Kotlin
      # mapping (plugins are obfuscated with -repackageclasses). Workflow
      # artifacts are visible only to accounts with read access to this
      # repository; if the repository ever becomes public, move these to
      # private storage, because they undo `--obfuscate`.
      - name: Upload Dart symbols (split-debug-info)
        if: env.release_signing == 'true' || env.production_profile == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-symbols-dart-${{ github.sha }}
          path: build/symbols/
          if-no-files-found: error
          retention-days: 90

      - name: Upload R8 mapping
        if: env.release_signing == 'true' || env.production_profile == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-symbols-r8-mapping-${{ github.sha }}
          path: build/app/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 90

      - name: Remove injected release credentials
        if: always() && (env.production_profile == 'true' || env.release_signing == 'true')
        run: rm -f android/keystore.properties android/release-keystore.jks android/app/google-services.json

  # Static checks, workflow/tool unit tests and the JVM host tests. Native host
  # tests need only the debug Flutter assets.
  analyze:
    name: Analyze and native host tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('pubspec.lock') }}"

      - name: Test release inventory gates
        run: python3 -m unittest discover -s tool -p '*_test.py'

      - name: Test embedded static rich-content policy
        run: node android/app/src/test/js/static_rich_content_policy_test.js

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      # gradlew and local.properties are generated by Flutter (gitignored); this job builds
      # no APK, so generate the Android build files before Gradle runs the host tests.
      - name: Generate Android build files
        run: flutter build apk --config-only --debug

      - name: Native host tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-native-test-evidence
          path: build/app/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

  # The Flutter suite split into deterministic round-robin shards
  # (tool/run_flutter_suite.py --shard-index/--shard-count): every test file
  # runs in exactly one shard, each with bounded batches and its own evidence.
  flutter-tests:
    name: Flutter tests (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    # Bounded batches reuse Flutter startup across files; two isolates per batch
    # keep memory bounded. ~1/3 of the suite per shard plus retry headroom.
    timeout-minutes: 45
    strategy:
      # Every shard must finish and retain evidence even if another fails.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('pubspec.lock') }}"

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test
        if: inputs.bounded_flutter_suite != true
        shell: bash
        run: |
          python3 tool/run_flutter_suite.py \
            --flutter "$(command -v flutter)" \
            --output "$RUNNER_TEMP/flutter-suite-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --lock "$RUNNER_TEMP/flutter-suite.lock" \
            --shard-index ${{ matrix.shard }} --shard-count 3 \
            --batch-size 20 --batch-timeout 600 --lock-timeout 900

      - name: Test with bounded Flutter suite runner
        if: inputs.bounded_flutter_suite == true
        shell: bash
        run: |
          python3 tool/run_flutter_suite.py \
            --flutter "$(command -v flutter)" \
            --output "$RUNNER_TEMP/flutter-suite-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --lock "$RUNNER_TEMP/flutter-suite.lock" \
            --shard-index ${{ matrix.shard }} --shard-count 3 \
            --batch-size 20 --batch-timeout 600 --lock-timeout 900

      - name: Upload bounded Flutter suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Flutter-suite-evidence-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/flutter-suite-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

  # Debug APK only when no signed release is built (pull requests, forks, or a
  # repository without the keystore secret); the release job covers pushes.
  debug-apk:
    name: Build debug APK
    needs: detect
    if: needs.detect.outputs.release_signing != 'true' && needs.detect.outputs.production_profile != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect development Firebase configuration
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "firebase=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('pubspec.lock') }}"

      # Inject Firebase config from secret — never committed to the repo.
      - name: Write google-services.json
        if: env.firebase == 'true' && inputs.production_release != true
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      # No sandbox bootstrap payload: execution is server-side now.

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=OVID_BUILD=${{ github.sha }}

      - name: Gate debug APK inventory
        run: >-
          python3 tool/release_inventory.py build/app/outputs/flutter-apk/app-debug.apk
          --mode debug --expected-target 36 --output build/release-inventory/debug.json

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-APK-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug inventory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ovid-debug-evidence
          path: build/release-inventory/
          if-no-files-found: warn
          retention-days: 30

  server-tests:
    name: Validate server account, sync, and collaboration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-test
          POSTGRES_DB: ovid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ovid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Job-local disposable database, never deployment credentials.
      SYNC_TEST_DATABASE_URL: postgresql://postgres:ci-disposable-test@127.0.0.1:5432/ovid_test
      COLLAB_TEST_POSTGRES_DSN: postgresql://postgres:ci-disposable-test@127.0.0.1:5432/ovid_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install server requirements
        run: python -m pip install -r server/account/requirements.txt pytest

      - name: Test deployment runtime CLI integration
        run: python -m unittest -v tool.deployment_config_test

      - name: Test server account, sync, and collaboration
        run: pytest server/account/tests server/sync server/collaboration server/images server/shares server/billing server/reports
