name: cloud

on:
  push:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"

# One run per ref: a newer push supersedes an in-flight run (saves runner time
# and keeps the shared staging/live host untouched by overlapping suites).
concurrency:
  group: cloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: cloud
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      # Cache the pnpm content-addressed store. Resolving the store path needs
      # pnpm on PATH, hence the step order (corepack before the cache step).
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cloud/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # P10 Task 10 audit gate: fail the job on high/critical advisories in
      # production dependencies. `--prod` ignores devDependencies (vitest,
      # typescript, …) whose advisories cannot reach the deployed images.
      - name: Audit dependencies (fail on high)
        run: pnpm audit --prod --audit-level=high
      # P10 Task 10 Python audit (ADVISORY). The staying Python LiteLLM hook
      # (server/mint/litellm_hook/ovid_pools.py) has NO requirements file: it
      # imports only stdlib + ovid_plans and runs inside the LiteLLM image
      # pinned to 1.105.0 (server/mint/README.md). Audit that documented
      # dependency set; the gate is advisory until HARDENING item G pins the
      # image digest and the hook gets a committed lock file.
      - name: Audit Python — LiteLLM hook deps (advisory)
        continue-on-error: true
        run: |
          printf 'litellm==1.105.0\n' > "$RUNNER_TEMP/litellm-hook-requirements.txt"
          pipx run pip-audit -r "$RUNNER_TEMP/litellm-hook-requirements.txt"
      - name: Build
        run: pnpm -r build
      # Uses the tsconfig.check.json configs, which include test sources.
      # They were written in P10-T3 but the step could not be switched until
      # the 174 pre-existing test-source type errors were cleared (done
      # 2026-10-18); until then this step checked production src only.
      - name: Typecheck (src + tests)
        run: pnpm -r exec tsc --noEmit -p tsconfig.check.json
      - name: Test
        run: pnpm -r test
