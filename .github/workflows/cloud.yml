name: cloud

on:
  push:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"

# One run per ref: a newer push supersedes an in-flight run (saves runner time
# and keeps the shared staging/live host untouched by overlapping suites).
concurrency:
  group: cloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: cloud
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      # Cache the pnpm content-addressed store. Resolving the store path needs
      # pnpm on PATH, hence the step order (corepack before the cache step).
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('cloud/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Typecheck
        run: pnpm -r exec tsc --noEmit -p tsconfig.json
      - name: Test
        run: pnpm -r test
