# Caddy route for Ovid Cloud — insertion snippet for the LIVE Caddyfile
# (/opt/ovid-gateway/caddy/Caddyfile). Owner-run at activation; full procedure
# + validation + rollback in DEPLOY.md §6. Do NOT reload Caddy from a script.
#
# WHERE: inside the `api.ovidsi.com` site block, AFTER `import ovid_public`.
# The import inlines the shared handle chain (@images/@api/@mint/@account/…
# plus the bare `handle { respond "Not found" 404 }` catch-all). Caddy handle
# blocks are mutually exclusive and ordered by matcher specificity: /cloud/*
# cannot overlap any existing matcher, and the bare catch-all always sorts
# last — so this block claims exactly the /cloud tree on api.ovidsi.com only
# (cloud.dhanuksoftwares.com keeps returning 404 for /cloud/*, matching its
# legacy-hostname role). The resulting site block:
#
#   api.ovidsi.com {
#   	import ovid_public
#
#   	# ── Ovid Cloud (P0 spine) ──
#   	# … (the lines below)
#   }
#
# WHY `handle`, NOT `handle_path`: the gateway OWNS the /cloud/v1 prefix
# (apps/gateway/src/app.ts, API_PREFIX) and expects to receive it intact —
# handle_path would strip /cloud and every route would 404.
#
# WebSocket upgrades (GET /cloud/ws?ticket=… — the WS path is deliberately
# NOT under /cloud/v1; apps/gateway/src/routes/wsRoute.ts) proxy transparently
# through reverse_proxy (Caddy forwards Upgrade/Connection by default); the
# global `timeouts` block (write 0 / idle 30m) already covers long-lived
# streaming connections. The single /cloud/* matcher above covers both the
# REST prefix and the WS path.
#
# PORT: must equal GATEWAY_HOST_PORT from /opt/ovid-cloud/.env (default 8082).
# 8081 is this Caddy's OWN admin-dashboard listener (bottom of the Caddyfile)
# — proxying /cloud/* to 8081 would loop into LiteLLM's UI, never the gateway.

	# ── Ovid Cloud (P0 spine): gateway REST + WS ──
	handle /cloud/* {
		request_body {
			max_size 20MB
		}
		reverse_proxy 127.0.0.1:8082 {
			header_up X-Forwarded-For {client_ip}
		}
	}

# ─────────────────────────────────────────────────────────────────────────────
# MCP OAuth callback (P5 Task 15) — the `ovidsi.com` SITE BLOCK, not
# `api.ovidsi.com` above. The Task-9 flow's default redirect URI is
# `https://ovidsi.com/oauth/callback` (OVID_MCP_REDIRECT_URI), and that host
# must reach the SAME gateway. This route is PUBLIC by design: the
# authorization server redirects the browser here without Ovid credentials;
# the one-use `state` query param is the bearer, validated atomically by the
# flow. Insert this `handle` inside the `ovidsi.com { … }` site block:
#
# 	handle /oauth/callback {
# 		reverse_proxy 127.0.0.1:8082 {
# 			header_up X-Forwarded-For {client_ip}
# 		}
# 	}
#
# The gateway serves this EXACT public path at its ROOT
# (`registerMcpOauthPublicCallbackRoute` in routes/mcpOauth.ts) in addition to
# the internal `/cloud/v1/mcp/oauth/callback` route, so the proxy forwards the
# path verbatim — do NOT add a rewrite/handle_path (that would 404). It must
# match OVID_MCP_REDIRECT_URI exactly (host + path); changing one without the
# other breaks every third-party MCP OAuth sign-in. Repo-only until
# owner-gated activation (DEPLOY.md).
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# GLOBAL trusted_proxies (Cloudflare) — DOCUMENTATION ONLY, not part of the
# site-block snippet above. Nothing here is copied at activation: the live
# /opt/ovid-gateway/caddy/Caddyfile ALREADY contains this block (verified
# 2026-10-16 against Cloudflare's official list — identical; see HARDENING.md
# item D for the re-check command). Kept here for DR / fresh provisioning of
# the gateway box.
#
# WHERE it goes: the TOP-LEVEL global options block `{ servers { … } }` at the
# very top of the Caddyfile — NEVER inside a site block. Requires Caddy ≥ 2.7
# (this box runs v2.11.4).
#
# Official CIDR source of truth (re-fetch, don't trust copies — Cloudflare
# changes these rarely):
#   curl -s https://www.cloudflare.com/ips-v4
#   curl -s https://www.cloudflare.com/ips-v6
#
# The block, exactly as present in the live Caddyfile (one line of CIDRs):
#
# {
# 	servers {
# 		trusted_proxies static 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
# 		client_ip_headers CF-Connecting-IP X-Forwarded-For
# 	}
# }
#
# (The CIDR list above is a documentation snapshot taken 2026-10-16 — when
# actually provisioning, build the line from the two curl commands; the live
# file is authoritative.)
#
# EFFECT for the /cloud/* block: {client_ip} — forwarded as X-Forwarded-For
# above — resolves to the real visitor IP from CF-Connecting-IP / XFF, but
# only when the direct peer is one of the trusted Cloudflare CIDRs. Direct
# origin hits keep their socket IP and cannot spoof those headers.
