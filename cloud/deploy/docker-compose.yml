# Ovid Cloud — gateway + dedicated queue Redis + loopback egress proxies.
#
# Runs ALONGSIDE the live ovid-gateway stack on the same VPS and joins its
# internal network (external) to reach postgres / mint / mint-redis / litellm
# by container DNS. redis-q is attached ONLY to the ovid-cloud network — the
# live stack never sees it, and it never sees the live stack's redis.
#
# P2 transition: the WORKER is no longer a compose service. It jails user
# code on the host (SandboxManager needs cgroup.procs writes, the
# /workspaces volume and nftables adjacency — none survive a container
# boundary) and now runs as a systemd unit: cloud/deploy/systemd/
# ovid-worker.service + worker.env.example, activated by DEPLOY.md §11.
# The host worker reaches its backends over loopback:
#   • redis-q publishes 127.0.0.1:6391 (host port REDIS_Q_HOST_PORT);
#   • net-proxy-pg / net-proxy-mint are socat relays on the internal network
#     publishing 127.0.0.1:5434 → ovid-gateway-postgres-1:5432 and
#     127.0.0.1:6392 → ovid-gateway-redis-1:6379 — the live stack itself is
#     untouched (the relays only connect TO its container names).
#
# Activation is a manual, owner-run procedure: see DEPLOY.md (env authoring,
# provisioning, compose up, Caddy route, backup timer; P2: §11). `docker
# compose config -q` is the safe dry validation; NOTHING here touches the
# live stack by itself.
#
# Host-port note: 127.0.0.1:8081 on this box is ALREADY the live Caddy's
# admin-dashboard listener (see /opt/ovid-gateway/caddy/Caddyfile, last block).
# The gateway therefore publishes on 127.0.0.1:${GATEWAY_HOST_PORT} (default
# 8082), and caddy-snippet.conf proxies /cloud/* to that port. INSIDE its
# container the gateway always listens on 0.0.0.0:8081 (HOST/PORT below —
# 0.0.0.0 is required for the published port to be reachable at all).

name: ovid-cloud

networks:
  internal:
    # The live stack's network — postgres, mint, mint-redis, litellm live on
    # it under their container-DNS names (ovid-gateway-postgres-1, …).
    external: true
    name: ovid-gateway_internal
  ovid-cloud:
    name: ovid-cloud
    driver: bridge

volumes:
  redis-q-data:
    name: ovid-cloud-redis-q-data
  # P7: cache-class redis-c data dir. The instance runs with AOF OFF
  # (allkeys-lru cache only), so nothing here is expected to survive a
  # restart — the volume exists for parity with redis-q and future use.
  redis-c-data:
    name: ovid-cloud-redis-c-data
  # Mint's persistent state (audit JSONL + settings/limits mirrors —
  # MINT_STATE_DIR=/data). Owned by ovid-cloud, never shared.
  mintdata:
    name: ovid-cloud-mintdata

services:
  # Queue + session-event-log Redis, owned by ovid-cloud (never shared with
  # the live stack's redis). Guarantee (spec AG3): a full queue fails LOUDLY
  # — maxmemory 1400mb gives redis a real write ceiling BELOW mem_limit
  # 1536m (headroom for buffers/AOF-fork COW so the kernel OOM-killer never
  # fires first), and noeviction turns writes at that ceiling into OOM
  # errors instead of silently evicting jobs/events. AOF everysec: survives
  # restarts.
  #
  # P2: loopback-only host port for the SYSTEMD worker (it no longer shares
  # this network namespace) — 127.0.0.1 binding, never 0.0.0.0: the queue is
  # not for the internet. Password is embedded in REDIS_Q_URL in
  # /opt/ovid-cloud/worker.env. ovid-cloud network ONLY — not reachable from
  # the live stack.
  redis-q:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "1400mb",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--requirepass",
        "${REDIS_Q_PASSWORD:?REDIS_Q_PASSWORD must be set in .env}",
      ]
    environment:
      # Only so the healthcheck's in-container shell can interpolate it.
      REDIS_Q_PASSWORD: ${REDIS_Q_PASSWORD:?REDIS_Q_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${REDIS_Q_HOST_PORT:-6391}:6379"
    volumes:
      - redis-q-data:/data
    mem_limit: 1536m
    # ovid-cloud network ONLY — not reachable from the live stack.
    networks: [ovid-cloud]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_Q_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Storage (P7) — cache-class Redis (spec §10 redis-c) ───────────────────
  # Session-activity keys for the warm-workspace tracker/LRU. CACHE ONLY:
  # allkeys-lru + no AOF, so a full instance evicts keys instead of failing
  # writes, and nothing is expected to survive a restart (Postgres
  # file_manifests.updated_at is the fallback authority — P7 Task 10).
  # redis-q stays noeviction: it carries jobs/events and must never lose them.
  # NEVER point queue/event traffic at redis-c.
  #
  # Loopback-only host port, mirroring redis-q: the HOST systemd worker (P2)
  # reaches it at 127.0.0.1:${REDIS_C_HOST_PORT:-6393}; the live stack cannot
  # (ovid-cloud network only).
  redis-c:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--appendonly",
        "no",
        "--requirepass",
        "${REDIS_C_PASSWORD:?REDIS_C_PASSWORD must be set in .env}",
      ]
    environment:
      # Only so the healthcheck's in-container shell can interpolate it.
      REDIS_C_PASSWORD: ${REDIS_C_PASSWORD:?REDIS_C_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${REDIS_C_HOST_PORT:-6393}:6379"
    volumes:
      - redis-c-data:/data
    mem_limit: 384m
    # ovid-cloud network ONLY — not reachable from the live stack.
    networks: [ovid-cloud]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_C_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Loopback egress proxies (P2): thin socat relays that give the HOST
  # systemd worker a stable 127.0.0.1 path to the live stack's postgres and
  # mint-redis over the shared internal network. The live ovid-gateway stack
  # is NEVER modified — the relays merely connect to its container DNS names
  # as clients. Backend auth is the live stack's own (postgres password /
  # REDIS_PASSWORD) — the relays terminate nothing.
  #
  # Pinned image: alpine/socat:1.8.1.3
  #   (socat 1.8.1.3, image created 2026-10-17,
  #    digest sha256:22d77becaeeea8ef56b8c4bb2312323acafe85354be6a85714ff5050e3537842
  #    resolved at Task-16 artifact time — re-pin deliberately, same policy
  #    as HARDENING.md item G).
  net-proxy-pg:
    image: alpine/socat:1.8.1.3
    restart: unless-stopped
    # fork + reuseaddr: every host-side connection gets its own relay;
    # restarts of the worker never exhaust the listener.
    command:
      [
        "TCP-LISTEN:5432,fork,reuseaddr",
        "TCP:ovid-gateway-postgres-1:5432",
      ]
    ports:
      - "127.0.0.1:${NET_PROXY_PG_HOST_PORT:-5434}:5432"
    networks: [internal]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  net-proxy-mint:
    image: alpine/socat:1.8.1.3
    restart: unless-stopped
    command:
      [
        "TCP-LISTEN:6379,fork,reuseaddr",
        "TCP:ovid-gateway-redis-1:6379",
      ]
    ports:
      - "127.0.0.1:${NET_PROXY_MINT_HOST_PORT:-6392}:6379"
    networks: [internal]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Structural overrides (win over .env): the container listener MUST be
      # 0.0.0.0 for the published port to be reachable; PORT is fixed at 8081
      # inside the container — the HOST-side port is GATEWAY_HOST_PORT below.
      HOST: 0.0.0.0
      PORT: "8081"
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8082}:8081"
    volumes:
      # Firebase Admin credentials — mount-vs-copy is an owner decision at
      # activation (DEPLOY.md §3); the default bind-mounts the live box's
      # file READ-ONLY. GOOGLE_APPLICATION_CREDENTIALS (from .env) points at
      # the in-container path.
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-/opt/ovid-gateway/firebase-admin.json}:/etc/ovid/firebase-admin.json:ro
    # P7: the worker file service runs in the HOST systemd worker (P2), not a
    # compose service. This alias lets OVID_WORKER_INTERNAL_URL reach it at
    # http://host.docker.internal:8091. (The compose-worker variant would use
    # the `worker` service name instead — see the P7 note further down.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis-q: { condition: service_healthy }
      # P7: activity bumps only. A degraded redis-c must NOT block REST —
      # the tracker falls back to REDIS_Q_URL when REDIS_C_URL is unset.
      redis-c: { condition: service_started }
    networks: [internal, ovid-cloud]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # 200 = ok; 503 (degraded) makes wget exit nonzero → unhealthy.
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8081/cloud/v1/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # (No `worker` service any more — see the P2 note in the file header. The
  # worker runs on the host as systemd unit ovid-worker.service
  # (cloud/deploy/systemd/), activated by DEPLOY.md §11. The P1 compose
  # worker this replaces is restorable from git history if ever needed.)
  #
  # P6 (browser engine) — worker envelope, BOTH variants (controller ruling
  # R3; the worker proper gets ~2 GB, the browser pool gets ~2 GB; P2's
  # sandbox slice keeps its own 10 G and the 22 GB box envelope is
  # unchanged; full budget math: cloud/deploy/BROWSERS.md §(c)):
  #   • LANDED (host systemd — this box): only the memory limit moves —
  #     ovid-worker.service already carries MemoryMax=4096M (G5 pre-flight
  #     ruling). The mounts become DIRECT host paths: /opt/ovid-browsers
  #     (Lightpanda binary + ms-playwright chromium root, ro by convention)
  #     and OVID_BROWSER_STATE_DIR=/opt/ovid-cloud/browser-states (plain
  #     directory — NOT a named volume; the local-disk store until P7/R2).
  #     Browser env vars live in worker.env (see worker.env.example
  #     "Browser engine (P6)" block), not in this file's .env.
  #   • If the compose-worker variant is ever restored from history, its
  #     service stanza needs: mem_limit: 4g; environment passthrough of the
  #     P6 browser vars (see .env.example "Browser engine (P6)" block);
  #     volumes /opt/ovid-browsers:/opt/ovid-browsers:ro and
  #     ovid-browser-states:/opt/ovid-cloud/browser-states (a named volume,
  #     declared next to redis-q-data/mintdata above). The same 4G split
  #     applies — never give the container less than 4 GB while the browser
  #     pool is enabled.
  #
  # ── Storage (P7) — compose-worker VARIANT requirements ───────────────────
  # The landed worker is host systemd (P2). If the compose-worker variant is
  # ever restored, it additionally needs (additive to the P6 block above):
  #   volumes:
  #     - ${WORKSPACES_ROOT:-/workspaces}:/workspaces        # rw — warm dirs
  #   environment:
  #     UV_THREADPOOL_SIZE: "8"   # libuv headroom: async zstd pack + fs
  #   depends_on:
  #     redis-c: { condition: service_healthy }
  # Host-systemd equivalents (the landed deployment): /workspaces is already
  # the XFS project-quota mount from deploy/workspaces/setup-workspaces.sh
  # (P2, DEPLOY.md §11 step 3); UV_THREADPOOL_SIZE=8 and the P7 storage env
  # live in /opt/ovid-cloud/worker.env (worker.env.example "Storage (P7)").

  # P9 Task 3: the mint REPLACEMENT app — the Node port of server/mint/mint.py
  # (cloud/apps/mint). BUILD-ONLY for now:
  #   • it sits behind the `mint` compose profile, so a plain
  #     `docker compose up` NEVER builds or starts it (and its image,
  #     deploy/Dockerfile.mint, is authored in Task 18 — building today would
  #     fail anyway);
  #   • activation (Caddy flips, .env authoring, the strangler cutover) is the
  #     owner-gated Task 18. Nothing here touches the live Python mint.
  # It joins `internal` (the live stack's network, external name
  # ovid-gateway_internal) to reach ovid-gateway-redis-1 (db2) and
  # ovid-gateway-litellm-1 by container DNS; both published ports stay
  # loopback-bound — the public app is meant to sit behind Caddy, the admin
  # console behind an SSH tunnel, never the internet.
  mint:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mint
    restart: unless-stopped
    profiles: [mint]
    env_file: [.env]
    environment:
      # Structural overrides (win over .env): the container listener MUST be
      # 0.0.0.0 for the published port to be reachable; ports are fixed
      # in-container — HOST-side ports are the publications below.
      HOST: 0.0.0.0
      PUBLIC_PORT: "8091"
      ADMIN_PORT: "8092"
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:8092:8092"
    volumes:
      - mintdata:/data
    networks: [internal]
    mem_limit: 1g
