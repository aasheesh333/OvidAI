# Flip 5 — @mint + @usage + /healthz + /upgrade → TS mint (127.0.0.1:8091)
#
# BEFORE EDITING: back up the Caddyfile (DECOMMISSION.md §1).
# LAST money-critical group. Replaces the Python mint target (8090).
# The admin listener (8092) MUST NEVER be exposed by Caddy — no handle for it.

	handle /mint {
		reverse_proxy 127.0.0.1:8091 {
			header_up X-Forwarded-For {client_ip}
		}
	}

	handle /upgrade {
		reverse_proxy 127.0.0.1:8091 {
			header_up X-Forwarded-For {client_ip}
		}
	}

	handle /usage {
		reverse_proxy 127.0.0.1:8091 {
			header_up X-Forwarded-For {client_ip}
		}
	}

	handle /healthz {
		reverse_proxy 127.0.0.1:8091 {
			header_up X-Forwarded-For {client_ip}
		}
	}

# SMOKES: GET /healthz → 200 {"ok":true}; POST /mint without a bearer → 401
# exact {"detail":"missing bearer id token"}; two POST /mint with a valid
# token return the SAME key with one /key/generate and no second
# budget_duration; POST /usage → 200 with the pinned field set; POST
# /upgrade without ALLOW_TEST_UPGRADE → 403.
#
# AFTER the flip 4–5 soak: docker stop ovid-gateway-mint-1. Keep litellm,
# img-edit-shim, redis, postgres and caddy running (DECOMMISSION.md §2).
