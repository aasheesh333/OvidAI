# Flip 4 — @images (/v1/images/*, /v1/models) → TS mint (127.0.0.1:8091)
#
# BEFORE EDITING: back up the Caddyfile (DECOMMISSION.md §1).
# Replaces the Python mint target (127.0.0.1:8090) for the images matcher.
# /v1/* → LiteLLM 4000 (the @api group) STAYS UNTOUCHED.

	handle /v1/images/* {
		reverse_proxy 127.0.0.1:8091 {
			header_up X-Forwarded-For {client_ip}
		}
	}

	handle /v1/models {
		reverse_proxy 127.0.0.1:8091 {
			header_up X-Forwarded-For {client_ip}
		}
	}

# SMOKES: GET /v1/images/capabilities with a valid key → 200 + ETag, repeat
# with If-None-Match → 304; POST /v1/images/generations without the
# ovid-image scope → 403 image_access_denied; a free account at cap → 402
# image_limit_reached with no upstream call; GET /v1/models → 200 with no
# private backend names (the live catalog projection masks them).
