# Flip 3 — NEW /billing/* → TS mint (127.0.0.1:8091)
#
# BEFORE EDITING: back up the Caddyfile (DECOMMISSION.md §1).
# This is an ACTIVATION, not a migration: the live Python mint never mounted
# /billing/* (verified read-only 2026-10-16), so no client currently depends
# on this path being Python.
# Insert inside the api.ovidsi.com site block. Match the exact tree; do not
# catch /billing without the slash (nothing else is published there).

	handle /billing/* {
		reverse_proxy 127.0.0.1:8091 {
			header_up X-Forwarded-For {client_ip}
		}
	}

