# Flip 1 — @account group → cloud gateway (127.0.0.1:8082)
#
# BEFORE EDITING: back up the Caddyfile (DECOMMISSION.md §1).
# Apply inside the `api.ovidsi.com { import ovid_public ... }` site block.
# Replace the account-dev (127.0.0.1:8080) targets for these paths.
# Keep the header_up X-Forwarded-For line identical to the existing /cloud/*
# block so the gateway's client-IP logic sees the real client.

	handle /account/* {
		reverse_proxy 127.0.0.1:8082 {
			header_up X-Forwarded-For {client_ip}
		}
	}

	handle /shares* {
		reverse_proxy 127.0.0.1:8082 {
			header_up X-Forwarded-For {client_ip}
		}
	}

	handle /s/* {
		reverse_proxy 127.0.0.1:8082 {
			header_up X-Forwarded-For {client_ip}
		}
	}

	handle /.well-known/assetlinks.json {
		reverse_proxy 127.0.0.1:8082 {
			header_up X-Forwarded-For {client_ip}
		}
	}

