# Flip 2 — NEW exact-path /v1/reports → cloud gateway (127.0.0.1:8082)
#
# BEFORE EDITING: back up the Caddyfile (DECOMMISSION.md §1).
# MUST be an EXACT path matcher, and it MUST sort ahead of `@api` (/v1/* →
# LiteLLM 4000). An ordinary `handle /v1/*` would send reports to LiteLLM.
# Insert ABOVE the @api handle in the api.ovidsi.com site block.

	handle /v1/reports {
		reverse_proxy 127.0.0.1:8082 {
			header_up X-Forwarded-For {client_ip}
		}
	}

