# W12/v2 — Cloudflare Worker TEMPLATE ONLY (owner-gated; not a live config).
# All names/hosts are non-production placeholders. No account/zone is enabled
# here and no secret belongs in this file. See README.md before any deploy.
#
# During a separately authorized deployment, provision BOTH secrets with the
# interactive command or dashboard (never put their values in [vars]):
#   npx wrangler secret put OVID_CDN_SIGNING_SECRET
#   npx wrangler secret put OVID_CDN_GRANT_INTERNAL_SECRET
# Each must be >=32 UTF-8 bytes and match gateway + host worker. These commands
# are documentation only; they were not run for this template revision.

name = "ovid-cdn-change-me"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "change-me-r2-bucket"

# Optional isolated custom-domain route; placeholders only. Prefer the
# owner-controlled dashboard flow, and never use the web app/API origin.
# [[routes]]
# pattern = "cdn.example.invalid/*"
# zone_name = "example.invalid"

[vars]
# REQUIRED for every v2 read: exact gateway ROOT assertion path, no query or
# fragment. Replace through the authorized deployment process; .invalid cannot
# reach a real gateway. Gateway/host worker do not consume this variable.
OVID_CDN_GRANT_CHECK_URL = "https://gateway-internal.example.invalid/internal/cdn-grants/assert-active"

# Optional documented public vars (secrets must NEVER be added here).
# OVID_CDN_ALLOWED_ORIGINS = "https://app.example.invalid"
# OVID_CDN_MAX_TTL_SECONDS = "3600"
# OVID_CDN_CACHE = "on"
