<script>
  function toggleReasoning() {
    const btn = document.getElementById('toggle-reasoning');
    const knob = document.getElementById('toggle-reasoning-knob');
    const isChecked = knob.classList.contains('translate-x-5');

    if (isChecked) {
      knob.classList.remove('translate-x-5');
      knob.classList.add('translate-x-0.5');
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-surface-container-highest');
      knob.innerHTML = '';
    } else {
      knob.classList.remove('translate-x-0.5');
      knob.classList.add('translate-x-5');
      btn.classList.remove('bg-surface-container-highest');
      btn.classList.add('bg-primary');
      knob.innerHTML = '<span class="material-symbols-outlined text-[14px] text-primary">check</span>';
    }
  }
</script></main></body></html>
