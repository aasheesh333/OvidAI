<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 rounded-full bg-primary/10 blur-3xl pointer-events-none transform-gpu animate-pulse"></div>

<div class="w-full flex justify-center items-center opacity-0 h-6">

</div>

<div class="flex flex-col items-center justify-center text-center relative z-10 px-margin">

<div class="relative flex items-center justify-center mb-space-lg group">
<!-- Outer Soft Glow Ring -->
<div class="absolute -inset-2 rounded-full bg-primary/10 blur-md"></div>
<!-- Primary Core Disc (Tactile Surface-Container Elevation) -->
<div class="relative w-20 h-20 rounded-full bg-surface-container flex items-center justify-center shadow-2xl">
<!-- Concentric Radial Pattern SVG -->
<svg class="w-full h-full p-2" fill="none" viewbox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
<!-- Outer Track -->
<circle class="text-surface-container-highest" cx="40" cy="40" r="34" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1.5"></circle>
<!-- Inner Concentric Orbit -->
<circle class="text-outline-variant/40" cx="40" cy="40" r="26" stroke="currentColor" stroke-width="1.5"></circle>
<!-- Center Ambient Core Fill -->
<circle class="fill-primary/20" cx="40" cy="40" r="14"></circle>

<path class="fill-primary" d="M40 31L42.2 37.8L49 40L42.2 42.2L40 49L37.8 42.2L31 40L37.8 37.8L40 31Z"></path>

</svg>
<!-- Subtle Living Status Ping -->
<span class="absolute top-1 right-1 flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-60"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-secondary"></span>
</span>
</div>
</div>
<!-- Wordmark -->
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mt-2 mb-space-xs">
      Ovid Si
    </h1>
<!-- Core Brand Tagline -->
<p class="font-body-sm text-body-sm text-outline tracking-widest uppercase mb-space-md">
      Chat. Code. Create.
    </p>
<!-- Version Status Pill -->
<div class="inline-flex items-center gap-space-xs px-3 py-1 rounded-full bg-surface-container-high shadow-sm">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container"></span>
<span class="font-caption text-caption text-on-surface-variant font-medium tracking-normal">

      </span>
</div>
</div>

<div class="flex flex-col items-center gap-space-md w-full max-w-xs relative z-10 pb-space-sm">

<div class="w-48 h-1 rounded-full bg-surface-container-high overflow-hidden relative shadow-inner">
<div class="h-full rounded-full bg-primary absolute transition-all duration-700 ease-out" id="splash-stream-bar" style="width: 32%; left: -10%;"></div>
</div>

      </span>
</div>
</div>
</div>
<script>
  (function() {
    const bar = document.getElementById('splash-stream-bar');
    if (!bar) return;
    
    let position = -30;
    let width = 28;
    
    function animateLoader() {
      position += 1.8;
      if (position > 105) {
        position = -35;
        width = 24 + Math.random() * 20;
      }
      bar.style.width = width + '%';
      bar.style.left = position + '%';
      requestAnimationFrame(animateLoader);
    }
    requestAnimationFrame(animateLoader);
  })();
